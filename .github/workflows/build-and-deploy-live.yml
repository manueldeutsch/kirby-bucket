name: Build & Deploy Live

on:
  push:
    branches: live

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # Install composer dependencies
      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      # Install npm dependencies & build
      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      # Cleanup
      - name: Delete unnecessary files
        run: |
          rm -rf node_modules
          rm -rf .git
          rm -rf .github
          rm -rf .parcel-cache
          rm -rf .gitignore
          rm -rf .editorconfig
          rm -rf .vscode
          rm -rf .claude
          rm -rf package-lock.json
          rm -rf package.json
          rm -rf readme.md

      # SFTP Deploy
      - name: 📂 Sync files
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: ${{ secrets.ftp_server_live }}
          port: 22
          username: ${{ secrets.ftp_user_live }}
          password: ${{ secrets.ftp_password_live }}
          remotePath: ${{ secrets.ftp_path_live }}
          localPath: "./"
          agent: null
