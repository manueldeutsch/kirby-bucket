name: Build & Deploy

on:
  push:
    branches: master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # Install composer dependencies
      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      # Install npm dependencies & build
      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      # Cleanup
      - name: Delete unnecessary files
        run: |
          rm -rf node_modules
          rm -rf .git
          rm -rf .github
          rm -rf .parcel-cache
          rm -rf .gitignore
          rm -rf .editorconfig
          rm -rf .vscode
          rm -rf .claude
          rm -rf package-lock.json
          rm -rf package.json
          rm -rf readme.md

      # FTP Deploy
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          server-dir: ${{ secrets.ftp_path }}
          protocol: ftps
          # security: loose # bei selbstsigniertem Zertifikat einkommentieren
